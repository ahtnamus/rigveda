name: Build Rigveda APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licences and install SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install packages
        run: npm ci

      - name: Copy the website into the Android app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rigveda.apk

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: Rigveda-APK
          path: Rigveda.apk

      - name: Publish the APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rigveda app (latest build)
          body: Download Rigveda.apk below and open it on your Android tablet.
          files: Rigveda.apk
          make_latest: true
